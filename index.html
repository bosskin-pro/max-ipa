<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAX — установка</title>
<style>
    body {
        margin: 0;
        padding: 40px 20px;
        font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
        text-align: center;
        background: #f5f5f7;
        color: #111;
    }
    .container {
        max-width: 500px;
        margin: 0 auto;
    }
    h1 {
        font-size: 28px;
        margin-bottom: 30px;
    }
    .install {
        display: inline-block;
        padding: 15px 40px;
        background: #0077ff;
        color: white;
        text-decoration: none;
        border-radius: 12px;
        font-size: 18px;
        font-weight: 600;
    }
    .info {
        margin-top: 20px;
        font-size: 15px;
        color: #777;
    }
</style>
</head>
<body>
<div class="container">
<h1>MAX</h1>
<div>
    Установка приложения на iPhone
</div>
<a class="install"
   href="itms-services://?action=download-manifest&url=https://raw.githubusercontent.com/bosskin-pro/max-ipa/main/manifest.plist">
    Установить
</a>
<div class="info">
    Нажмите «Установить» и дождитесь окончания установки.
</div>
</div>
</body>
</html>
